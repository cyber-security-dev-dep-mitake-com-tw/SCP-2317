name: package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  package-windows:
    name: Windows 10/11 installers (.exe / .msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC missing at $iscc" }

      - name: Install WiX v4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix --version

      - name: Build Windows packages
        shell: pwsh
        run: .\scripts\gitlab\package-windows.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scp2317-windows-x64
          path: |
            dist/windows/SCP-2317-Setup.exe
            dist/windows/SCP-2317.msi
          if-no-files-found: error

  package-macos:
    name: macOS installers (.pkg / .dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build macOS packages
        run: bash scripts/gitlab/package-macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scp2317-macos-arm64
          path: |
            dist/macos/SCP-2317.pkg
            dist/macos/SCP-2317.dmg
          if-no-files-found: error

  package-macos-intel:
    name: macOS Intel installers (.pkg / .dmg)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build macOS packages (amd64)
        env:
          GOARCH: amd64
        run: bash scripts/gitlab/package-macos.sh

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scp2317-macos-amd64
          path: |
            dist/macos/SCP-2317.pkg
            dist/macos/SCP-2317.dmg
          if-no-files-found: error
