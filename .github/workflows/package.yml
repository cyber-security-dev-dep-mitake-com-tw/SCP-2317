name: package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  package-windows:
    name: Windows 10/11 installers (.exe / .msi)
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.SCP2317_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC missing at $iscc" }

      - name: Install WiX v4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix --version

      # Stage the Authenticode certificate from repository secrets. Store the
      # .pfx as base64 in secret SCP2317_CERT_PFX_BASE64 and its password in
      # SCP2317_CERT_PASSWORD. When unset, the build proceeds UNSIGNED.
      - name: Prepare code-signing certificate
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.SCP2317_CERT_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
            Write-Host "No SCP2317_CERT_PFX_BASE64 secret set; artifacts will be UNSIGNED."
          } else {
            $pfx = Join-Path $env:RUNNER_TEMP 'scp2317-codesign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
            "SCP2317_CERT_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Certificate staged for signing."
          }

      # signtool.exe ships with the Windows SDK but is not on PATH by default.
      - name: Locate signtool
        shell: pwsh
        run: |
          $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($st) {
            Split-Path $st.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            Write-Host "signtool: $($st.FullName)"
          } else {
            Write-Warning "signtool.exe not found; signing steps will be skipped."
          }

      - name: Build Windows packages
        shell: pwsh
        env:
          SCP2317_CERT_PASSWORD: ${{ secrets.SCP2317_CERT_PASSWORD }}
        run: .\scripts\gitlab\package-windows.ps1

      - name: Verify signatures
        if: ${{ env.HAS_CERT == 'true' }}
        shell: pwsh
        run: |
          # 'Valid' = signed + trusted chain (real CA cert). A self-signed cert
          # produces a valid signature whose chain is untrusted on the runner,
          # which surfaces as 'UnknownError' with a SignerCertificate present —
          # that is expected and acceptable. Only unsigned or tampered files fail.
          $targets = @('dist/windows/SCP-2317-Setup.exe', 'dist/windows/SCP-2317.msi')
          foreach ($t in $targets) {
            $sig = Get-AuthenticodeSignature $t
            Write-Host "$t -> $($sig.Status)"
            if ($sig.Status -eq 'Valid') { continue }
            if ($null -ne $sig.SignerCertificate) {
              Write-Warning "$t is signed but its certificate chain is not trusted on this runner (expected for a self-signed cert; use an OV/EV cert for a trusted chain)."
              continue
            }
            throw "Signature check failed for $t ($($sig.Status)) - file is not signed"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scp2317-windows-x64
          path: |
            dist/windows/SCP-2317-Setup.exe
            dist/windows/SCP-2317.msi
          if-no-files-found: error

  package-macos:
    name: macOS installers (.pkg / .dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build macOS packages
        run: bash scripts/gitlab/package-macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scp2317-macos-arm64
          path: |
            dist/macos/SCP-2317.pkg
            dist/macos/SCP-2317.dmg
          if-no-files-found: error

