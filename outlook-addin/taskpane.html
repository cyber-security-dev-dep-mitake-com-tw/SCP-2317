<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SCP-2317</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script>
      // Override before the module loads if you need a non-default API host.
      // globalThis.SCP2317_API_BASE = "http://127.0.0.1:8080";
    </script>
  </head>
  <body>
    <button id="scan">Scan email</button>
    <pre id="result">Ready</pre>
    <script type="module">
      import "./dist/taskpane.js";
      document.querySelector("#scan").onclick = async () => {
        const out = document.querySelector("#result");
        try {
          out.textContent = JSON.stringify(
            await globalThis.scanCurrentItem(),
            null,
            2
          );
        } catch (e) {
          out.textContent = String(e);
        }
      };
    </script>
  </body>
</html>
